name: Daily Israeli Tech Job Crawler

on:
  schedule:
    # Runs 4 times a day (UTC 06:00, 10:00, 14:00, 18:00 -> Israel 08:00, 12:00, 16:00, 20:00)
    - cron: '0 6,10,14,18 * * *'
  workflow_dispatch: # Allows manual run at any time from GitHub UI

permissions:
  contents: write

# Never run two crawls at once (a manual run can overlap the next scheduled one).
concurrency:
  group: job-crawler
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          # A queued run must start from the latest main, not from the commit
          # that was current when it was triggered (which may be hours old).
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Run Job Crawler
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-flash-lite-latest"
        run: |
          python job_crawler.py

      - name: Commit and Push Updated Seen Jobs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- seen_jobs.json rejected_jobs.json; then
            echo "No changes to commit."; exit 0
          fi
          # Keep this run's results aside, then merge them into the latest main.
          # (A plain rebase conflicts whenever main changed these files meanwhile.)
          cp seen_jobs.json "$RUNNER_TEMP/our_seen.json"
          cp rejected_jobs.json "$RUNNER_TEMP/our_rejected.json"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python merge_state.py "$RUNNER_TEMP/our_seen.json" "$RUNNER_TEMP/our_rejected.json"
            git add seen_jobs.json rejected_jobs.json
            if git diff --staged --quiet; then echo "Nothing new after merge."; exit 0; fi
            git commit -m "Auto-update seen jobs database [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            echo "Push rejected (main moved), retrying ($attempt)..."; sleep 5
          done
          exit 1

      - name: Upload Daily Excel Report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: daily-jobs-excel
          path: new_jobs_*.xlsx
          retention-days: 14